name: Build APK from ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Unzip the Project
      run: |
        # This finds any .zip file in the root and extracts it to a folder called 'source_code'
        unzip -q *.zip -d source_code
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.10.2 
        
    - name: Build Debug APK
      run: |
        cd source_code
        gradle assembleDebug
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: OpdsAggregator-APK
        path: source_code/app/build/outputs/apk/debug/app-debug.apk
